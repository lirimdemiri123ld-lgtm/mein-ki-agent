name: Jarvis Android bauen

on:
  push:
    branches: [jarvis-android]
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sprachmodell für «Hallo Jarvis» laden
        run: |
          A=jarvis-android/app/src/main/assets
          mkdir -p $A
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm -rf $A/model-en
          mv vosk-model-small-en-us-0.15 $A/model-en
          echo "en-us-0.15" > $A/model-en/uuid
          echo "Modell-Dateien:"; find $A/model-en -type f | head -30
          echo "Wort 'jarvis' im Vokabular?"; grep -railw "jarvis" $A/model-en || echo "NICHT gefunden"

      - name: Hörtest «Hallo Jarvis»
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install -q vosk
          for v in de en de+m3 en-us+f2; do
            espeak-ng -v $v -s 140 -w t_$v.wav "Hallo Jarvis"
          done
          espeak-ng -v de -w t_neg.wav "Hallo Marcel, wie geht es dir heute"
          python3 jarvis-android/tools/wake_test.py jarvis-android/app/src/main/assets/model-en t_*.wav 2>&1 | grep -viE "^LOG \(VoskAPI:(ReadDataFiles|RemoveOrphan|CompileLooped|ComputeDerived)" | tail -40

      - name: APK bauen
        working-directory: jarvis-android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " jarvis-android/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jarvis-android/app/build/outputs/apk/release/app-release.apk Jarvis.apk
          gh release delete jarvis-latest -y --cleanup-tag || true
          gh release create jarvis-latest Jarvis.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Jarvis – neueste Version" \
            --notes "Build ${{ github.run_number }}. Auf dem Handy öffnen, Jarvis.apk herunterladen und installieren."
