name: Jarvis Android bauen

on:
  push:
    branches: [jarvis-android]
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/jarvis-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sprachmodell für «Hallo Jarvis» laden
        run: |
          A=jarvis-android/app/src/main/assets
          mkdir -p $A
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm -rf $A/model-en
          mv vosk-model-small-en-us-0.15 $A/model-en
          echo "en-us-0.15" > $A/model-en/uuid
          echo "Modell-Dateien:"; find $A/model-en -type f | head -30
          echo "Wort 'jarvis' im Vokabular?"; grep -railw "jarvis" $A/model-en || echo "NICHT gefunden"

      - name: Hörtest «Hallo Jarvis»
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install -q vosk
          for v in de en de+m3 en-us+f2; do
            espeak-ng -v $v -s 140 -w t_$v.wav "Hallo Jarvis"
          done
          espeak-ng -v de -w t_neg.wav "Hallo Marcel, wie geht es dir heute"
          python3 jarvis-android/tools/wake_test.py jarvis-android/app/src/main/assets/model-en t_*.wav 2>&1 | grep -viE "^LOG \(VoskAPI:(ReadDataFiles|RemoveOrphan|CompileLooped|ComputeDerived)" | tail -40

      - name: Neuronale Stimmen (sherpa-onnx) vorbereiten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=v1.12.40
          gh api repos/k2-fsa/sherpa-onnx/releases/tags/$V --jq '.assets[].name' | grep -i android || true
          NAME=$(gh api repos/k2-fsa/sherpa-onnx/releases/tags/$V --jq '.assets[].name' | grep -E "^sherpa-onnx-$V-android\.tar\.bz2$" | head -1)
          echo "Android-Paket: $NAME"
          curl -sSL -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/$NAME"
          mkdir -p sherpa && tar xjf sherpa.tar.bz2 -C sherpa
          find sherpa -path "*arm64-v8a*" -name "*.so" | head
          J=jarvis-android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          find sherpa -path "*arm64-v8a*" -name "*.so" -exec cp {} $J/ \;
          ls -la $J
          gh api --paginate repos/k2-fsa/sherpa-onnx/releases/tags/tts-models --jq '.assets' > tts_assets.json || \
            gh api "repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" --jq '.assets' > tts_assets.json
          python3 -c "import json;print(len(json.load(open('tts_assets.json'))),'Assets')"
          python3 jarvis-android/tools/make_voices.py tts_assets.json jarvis-android/app/src/main/assets/voices.json

      - name: Stimmtest (sherpa-onnx)
        continue-on-error: true
        run: |
          pip install -q sherpa-onnx==1.12.40
          U=$(python3 -c "import json;print([v['url'] for v in json.load(open('jarvis-android/app/src/main/assets/voices.json')) if 'thorsten-medium' in v['id']][0])")
          curl -sSL -o v.tar.bz2 "$U" && mkdir -p vt && tar xjf v.tar.bz2 -C vt
          python3 jarvis-android/tools/tts_test.py "$(ls -d vt/*/ | head -1)"

      - name: Test lokales Gehirn (Gemma 4 E2B)
        if: contains(github.event.head_commit.message, '[gehirntest]')
        continue-on-error: true
        working-directory: jarvis-android/tools/localtest
        run: |
          curl -sSL -o /tmp/m.litertlm "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/6e5c4f1e395deb959c494953478fa5cec4b8008f/gemma-4-E2B-it.litertlm?download=true"
          ls -la /tmp/m.litertlm
          gradle run --no-daemon -q --args="/tmp/m.litertlm $GITHUB_WORKSPACE/jarvis-android/app/src/main/assets/local_tools.json" 2>&1 | tail -40

      - name: APK bauen
        working-directory: jarvis-android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " jarvis-android/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jarvis-android/app/build/outputs/apk/release/app-release.apk Jarvis.apk
          gh release delete jarvis-latest -y --cleanup-tag || true
          gh release create jarvis-latest Jarvis.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Jarvis – neueste Version" \
            --notes "Build ${{ github.run_number }}. Auf dem Handy öffnen, Jarvis.apk herunterladen und installieren."
